[package]
name = "boy"
version = "0.5.0"
edition = "2024"
description = "A personal package manager for prebuilt binaries"
publish = false

[dependencies]
anyhow = "1.0.105"
flate2 = "1.1.11"
lzma-rs = "0.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11"
sha2 = "0.11.1"
tar = "0.4.46"
toml = "1.2.2"
ureq = "3.5.2"
zip = { version = "9.8.2", default-features = false, features = ["deflate-flate2"] }

[profile.release]
strip = true
lto = true
codegen-units = 1

[dev-dependencies]
tempfile = "3.27.0"
