name = "ripgrep-all"
info = "ripgrep that also searches PDFs, e-books, Office documents, archives"
from = "github"
repo = "phiresky/ripgrep-all"
bins = ["rga", "rga-preproc", "rga-fzf", "rga-fzf-open"]

# No checksum file in the release. Every command sits next to `path`.
[plat]
macos-x86_64  = { file = "ripgrep_all-v{version}-x86_64-apple-darwin.tar.gz", path = "ripgrep_all-v{version}-x86_64-apple-darwin/rga" }
macos-aarch64 = { file = "ripgrep_all-v{version}-aarch64-apple-darwin.tar.gz", path = "ripgrep_all-v{version}-aarch64-apple-darwin/rga" }
