name = "fd"
info = "Simple, fast alternative to find"
from = "github"
repo = "sharkdp/fd"
bins = ["fd"]

# The release has no checksum file.
[plat]
macos-x86_64  = { file = "fd-v{version}-x86_64-apple-darwin.tar.gz", path = "fd-v{version}-x86_64-apple-darwin/fd" }
macos-aarch64 = { file = "fd-v{version}-aarch64-apple-darwin.tar.gz", path = "fd-v{version}-aarch64-apple-darwin/fd" }
