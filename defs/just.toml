name = "just"
info = "Command runner for project tasks"
from = "github"
repo = "casey/just"
tags = "{version}"
bins = ["just"]
sums = "SHA256SUMS"

[plat]
macos-x86_64  = { file = "just-{version}-x86_64-apple-darwin.tar.gz", path = "just" }
macos-aarch64 = { file = "just-{version}-aarch64-apple-darwin.tar.gz", path = "just" }
