name = "uv"
info = "Fast Python package and project manager"
from = "github"
repo = "astral-sh/uv"
tags = "{version}"
bins = ["uv", "uvx"]
sums = "{file}.sha256"

[plat]
macos-x86_64  = { file = "uv-x86_64-apple-darwin.tar.gz", path = "uv-x86_64-apple-darwin/uv" }
macos-aarch64 = { file = "uv-aarch64-apple-darwin.tar.gz", path = "uv-aarch64-apple-darwin/uv" }
