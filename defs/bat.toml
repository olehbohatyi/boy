name = "bat"
info = "cat with syntax highlighting and git changes"
from = "github"
repo = "sharkdp/bat"
bins = ["bat"]

# The release has no checksum file.
[plat]
macos-x86_64  = { file = "bat-v{version}-x86_64-apple-darwin.tar.gz", path = "bat-v{version}-x86_64-apple-darwin/bat" }
macos-aarch64 = { file = "bat-v{version}-aarch64-apple-darwin.tar.gz", path = "bat-v{version}-aarch64-apple-darwin/bat" }
