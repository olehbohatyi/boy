name: release

# Publishes a GitHub release when a tag `v<version>` is pushed. The version must match
# Cargo.toml. This workflow is the template for every utility in the boy family:
#   <name>-<version>-<target>.tar.gz   with the binary at the archive root
#   SHA256SUMS                         `hash  file` lines, as boy's `sums` key expects

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            min_macos: "10.12"
          - target: aarch64-apple-darwin
            runner: macos-15
            min_macos: "11.0"
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.min_macos }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0" # keep in sync with rust-toolchain.toml
          targets: ${{ matrix.target }}
      - name: Test
        run: cargo test --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Check the binary runs and its minimum macOS
        run: |
          bin=target/${{ matrix.target }}/release/boy
          "$bin"
          vtool -show-build "$bin" | grep -Eq "(minos|version) ${{ matrix.min_macos }}"
      - name: Package
        run: |
          file="boy-$VERSION-${{ matrix.target }}.tar.gz"
          tar -C target/${{ matrix.target }}/release -czf "$file" boy
          echo "FILE=$file" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE }}
          path: ${{ env.FILE }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "boy ${GITHUB_REF_NAME#v}" \
            --generate-notes
