name: Claude Review

# Automatic code review when a pull request is opened (or leaves draft).
# Later pushes are not re-reviewed; mention @claude on the PR for another pass.

on:
  pull_request:
    types: [opened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts, PRs from forks and Dependabot's PRs (secrets are not available to them)
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the diff against the base branch can be computed
          fetch-depth: 0

      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE BRANCH: ${{ github.base_ref }}

            Review this pull request. The PR branch is checked out in the working directory.

            Before you conclude anything, read with the Read tool:
            1. CLAUDE.md (project rules);
            2. the sections of docs/prd.md the change touches;
            3. every file the PR changes, in full (not only the diff hunks), and the callers of
               any function whose behaviour changes (find them with Grep).
            Hold the change to CLAUDE.md and the PRD.

            Review ONLY what this PR changes. Get the change with `gh pr diff ${{ github.event.pull_request.number }}`
            (or `git diff origin/${{ github.base_ref }}...HEAD`): lines starting with `+` are added by
            the PR, lines starting with `-` are removed by it. Never treat a removed line as the
            PR's content, and check a claim against the diff direction before reporting it. Files
            in the working directory show the state AFTER the PR, so before saying the PR drops or
            lacks something, confirm it with Read that the PR's version really omits it.

            Focus on, in this order:
            - Correctness: bugs, error handling, edge cases in tag patterns, `{version}` expansion,
              platform keys and lock.toml updates.
            - Filesystem safety: nothing written outside the boy home; archive entries, `path`
              values and symlinked commands stay inside the package folder; a failure leaves
              temp/, pkgs/, bins/ and lock.toml as they were; symlinks in bins/ stay relative.
            - The rules in CLAUDE.md: no GitHub API or tokens, four-letter names, curated
              definitions with explicit file names, macOS-only v1.
            - Tests: every bug fix needs a regression test; network tests must be #[ignore].
            - Security and performance issues that matter for this change.

            Do not comment on formatting (cargo fmt runs in CI) or lints (clippy -D warnings fails
            the build). Skip praise and restating the diff.

            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) for
            issues tied to specific lines.

            Your final message is NOT shown to anyone. The only way the author sees your review is
            a PR comment, so ALWAYS finish by posting exactly one summary with
            `gh pr comment ${{ github.event.pull_request.number }} --body "..."`, even when you
            found nothing: then the body is one line, "No issues found." followed by what you
            checked (for example "Checked install.rs, update.rs against CLAUDE.md and PRD §8.").
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Read,Grep,Glob"
