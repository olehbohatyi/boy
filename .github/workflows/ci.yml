name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            min_macos: "10.12"
          - target: aarch64-apple-darwin
            runner: macos-15
            min_macos: "11.0"
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.min_macos }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0" # keep in sync with rust-toolchain.toml
          targets: ${{ matrix.target }}
          components: clippy, rustfmt
      - name: Lint
        run: |
          cargo fmt --check
          cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Test
        run: cargo test --target ${{ matrix.target }}
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}
      - name: Check the binary runs and its minimum macOS
        run: |
          bin=target/${{ matrix.target }}/release/boy
          "$bin"
          vtool -show-build "$bin"
          vtool -show-build "$bin" | grep -Eq "(minos|version) ${{ matrix.min_macos }}"
      - name: Install with install.sh (latest published release, no terminal)
        run: |
          home="$RUNNER_TEMP/home"
          mkdir -p "$home" && touch "$home/.zshrc"
          HOME="$home" SHELL=/bin/zsh sh install.sh </dev/null 2>"$RUNNER_TEMP/out"
          cat "$RUNNER_TEMP/out"
          "$home/.boy/bins/boy" | head -1 | grep -q '^boy '
          "$home/.boy/bins/boy" l | grep -q '^boy '
          grep -qF 'export PATH="$HOME/.boy/bins:$PATH"' "$RUNNER_TEMP/out"
          [ ! -s "$home/.zshrc" ] # no answer, so the shell file is untouched
      - uses: actions/upload-artifact@v4
        with:
          name: boy-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/boy

  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck install.sh
